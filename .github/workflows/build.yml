name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

# 发版那一步要写 Release，所以给 write（只读会 403）
permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure .NET Framework 4.8 targeting pack
        shell: pwsh
        run: |
          $fac = "C:\Program Files (x86)\Reference Assemblies\Microsoft\Framework\.NETFramework\v4.8\Facades\netstandard.dll"
          if (!(Test-Path $fac)) {
            Write-Host "netstandard facade missing, installing netfx-4.8-devpack ..."
            choco install netfx-4.8-devpack -y --no-progress
          }
          if (!(Test-Path $fac)) { throw "still missing: $fac" }

      - name: Fetch WebView2 SDK binaries (not committed)
        shell: pwsh
        run: ./get-webview2.ps1

      - name: Build with .NET Framework csc
        shell: pwsh
        run: |
          $csc = "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          $fac = "C:\Program Files (x86)\Reference Assemblies\Microsoft\Framework\.NETFramework\v4.8\Facades\netstandard.dll"
          if (!(Test-Path $csc)) { throw "csc.exe not found" }

          $cscArgs = @(
            '/nologo', '/codepage:65001', '/target:winexe',
            '/out:拼图板.exe', '/win32icon:app.ico',
            'launcher.cs',
            '/r:System.dll', '/r:System.Core.dll',
            '/r:System.Windows.Forms.dll', '/r:System.Drawing.dll',
            '/r:Microsoft.Web.WebView2.Core.dll', "/r:$fac"
          )
          & $csc @cscArgs
          if ($LASTEXITCODE -ne 0) { throw "build failed (exit $LASTEXITCODE)" }
          if (!(Test-Path '拼图板.exe')) { throw "output missing" }
          Get-ChildItem *.exe | Select-Object Name, Length | Format-Table

      - name: Pack release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          $files = @(
            '拼图板.exe', 'index.html', 'app.ico',
            'Microsoft.Web.WebView2.Core.dll', 'WebView2Loader.dll',
            'README.md', 'LICENSE', 'THIRD-PARTY-NOTICES.md', 'SECURITY.md',
            '诊断.bat'
          )
          foreach ($f in $files) {
            if (!(Test-Path -LiteralPath $f)) { throw "missing: $f" }
            Copy-Item -LiteralPath $f -Destination dist
          }
          Get-ChildItem dist -File | Get-FileHash -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash)  $($_.Path | Split-Path -Leaf)" } |
            Set-Content -Path dist/SHA256SUMS.txt -Encoding utf8
          Get-ChildItem dist | Select-Object Name, Length | Format-Table

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hero-grid-board-windows-x64
          path: dist/
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**
          generate_release_notes: true
